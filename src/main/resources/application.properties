spring.application.name=prjtHospital
# Caminho para o ficheiro da sua base de dados (coloque o ficheiro .db na raiz do projeto ou indique o caminho completo)
spring.datasource.url=jdbc:sqlite:hospital_simulador.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Informa ao Hibernate qual o dialeto a utilizar
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# REGRA CRÍTICA: Define que o Spring NÃO deve tentar criar ou alterar as tabelas. 
# Como já validámos o seu DDL completo gerado no DrawDB, o Spring deve apenas "ler" a estrutura existente.
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal o SQL que o Spring está a executar por trás dos panos (útil para debug)
spring.jpa.show-sql=true